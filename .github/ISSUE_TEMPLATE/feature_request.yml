name: Feature request
description: Suggest an idea for Socketto
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How would you like it to work? An API sketch helps.
      render: ts
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
