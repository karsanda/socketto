name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC) with provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # No registry-url: it writes an empty `_authToken` to .npmrc, which makes npm skip OIDC
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Opens a "Version Packages" PR while changesets are pending; publishes once it's merged
      - uses: changesets/action@v2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm release
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
        env:
          # read by @changesets/changelog-github during `changeset version`
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
